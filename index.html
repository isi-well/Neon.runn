<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер учёбы</title>
  <style>
    /* ========== CSS-переменные для тем ========== */
    :root {
      --bg: #0b1020;
      --bg-elevated: #12182b;
      --bg-card: #171e33;
      --bg-hover: #232b45;
      --text: #eef2ff;
      --text-muted: #a5b0c9;
      --border: #2a3350;
      --primary: #7c8cff;
      --primary-hover: #6677f5;
      --accent: #a78bfa;
      --danger: #f87171;
      --warning: #fbbf24;
      --success: #34d399;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      --radius: 14px;
      --transition: 0.2s ease;
    }

    body.light {
      --bg: #f3f5fb;
      --bg-elevated: #ffffff;
      --bg-card: #ffffff;
      --bg-hover: #eef1f8;
      --text: #121826;
      --text-muted: #5b677d;
      --border: #d7deeb;
      --primary: #4f6ef7;
      --primary-hover: #3d5ce5;
      --accent: #7c5cfc;
      --danger: #e11d48;
      --warning: #d97706;
      --success: #059669;
      --shadow: 0 6px 18px rgba(25, 40, 80, 0.08);
    }

    /* ========== Базовые стили ========== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(124, 140, 255, 0.14), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(167, 139, 250, 0.10), transparent 50%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
    }

    body.light {
      background:
        radial-gradient(1000px 500px at 0% 0%, rgba(79, 110, 247, 0.08), transparent 50%),
        radial-gradient(800px 400px at 100% 0%, rgba(124, 92, 252, 0.06), transparent 50%),
        var(--bg);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    /* ========== Шапка ========== */
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Профиль в шапке */
    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 4px 12px 4px 4px;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
    }

    .user-profile-badge:hover {
      background: var(--bg-hover);
      border-color: var(--primary);
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      flex-shrink: 0;
      overflow: hidden;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-name-display {
      font-size: 0.95rem;
      font-weight: 600;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background var(--transition);
    }

    .theme-toggle:hover {
      background: var(--bg-hover);
    }

    /* ========== Прогресс ========== */
    .progress-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .progress-bar {
      height: 12px;
      background: var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent), var(--success));
      border-radius: 6px;
      transition: width 0.4s ease;
    }

    /* ========== Кнопки и фильтры ========== */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    button, .btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: filter var(--transition), transform 0.1s, opacity var(--transition);
    }

    button:hover, .btn:hover {
      filter: brightness(1.08);
    }

    button.secondary {
      background: var(--bg-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      filter: none;
    }

    button.secondary:hover {
      background: var(--bg-hover);
      filter: none;
    }

    button:active {
      transform: scale(0.97);
    }

    button.danger {
      background: var(--danger);
      filter: none;
    }

    button.danger:hover {
      background: color-mix(in srgb, var(--danger) 85%, #000);
      filter: none;
    }

    button.small {
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    button.small:not(.secondary):not(.danger) {
      background: linear-gradient(135deg, var(--primary), var(--accent));
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      background: var(--bg-card);
      padding: 14px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      align-items: flex-end;
    }

    .filters label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-right: 4px;
      display: block;
      margin-bottom: 4px;
    }

    .filters > div {
      display: flex;
      flex-direction: column;
    }

    select, input[type="text"], input[type="date"], input[type="search"], textarea {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color var(--transition);
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--primary);
    }

    .search-sort-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }

    .search-sort-row input[type="search"] {
      flex: 1;
      min-width: 180px;
    }

    /* Статистика по предметам */
    .subject-stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .subject-stat-card {
      background: var(--bg-card);
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
    }

    .subject-stat-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .subject-stat-bar {
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .subject-stat-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .subject-stat-text {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* ========== Карточки заданий ========== */
    .section-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tasks-grid {
      display: grid;
      gap: 14px;
    }

    .task-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      border-left: 5px solid var(--primary);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
      position: relative;
    }

    .task-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      border-color: color-mix(in srgb, var(--primary) 35%, var(--border));
    }

    .task-card.overdue {
      border-left-color: var(--danger);
      background: color-mix(in srgb, var(--danger) 8%, var(--bg-card));
    }

    .task-card.soon {
      border-left-color: var(--warning);
      background: color-mix(in srgb, var(--warning) 8%, var(--bg-card));
    }

    .task-card.completed {
      opacity: 0.75;
      border-left-color: var(--success);
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .task-title {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge.priority-low { background: color-mix(in srgb, var(--text-muted) 22%, transparent); color: var(--text-muted); }
    .badge.priority-medium { background: color-mix(in srgb, var(--warning) 22%, transparent); color: var(--warning); }
    .badge.priority-high { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger); }

    .subject-badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      color: white;
    }

    .task-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      white-space: pre-wrap;
    }

    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      background: var(--bg-card);
      border-radius: var(--radius);
    }

    /* ========== Предметы ========== */
    .subjects-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .subject-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 6px 12px;
      font-size: 0.9rem;
    }

    .subject-color {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ========== Модальные окна ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      font-size: 1.2rem;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px 8px;
      line-height: 1;
    }

    .modal-body {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    /* Стили для выбора фото профиля */
    .avatar-upload-container {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .avatar-preview-lg {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.6rem;
      font-weight: 600;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--border);
    }

    .avatar-preview-lg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .color-picker {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .color-option {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      transition: border-color var(--transition);
    }

    .color-option.selected {
      border-color: var(--text);
    }

    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }


    /* План на сегодня */
    .today-plan {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .today-plan-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .today-plan-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .today-plan-list { display: grid; gap: 10px; }
    .today-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 10px;
      border-left: 4px solid var(--primary);
    }
    .today-item.overdue { border-left-color: var(--danger); }
    .today-item.today { border-left-color: var(--warning); }
    .today-item-info { flex: 1; min-width: 0; }
    .today-item-title { font-weight: 600; font-size: 0.95rem; }
    .today-item-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    /* Напоминания */
    .task-card.remind-1 { border-left-color: #f97316; background: color-mix(in srgb, #f97316 10%, var(--bg-card)); }
    .task-card.remind-3 { border-left-color: var(--warning); background: color-mix(in srgb, var(--warning) 8%, var(--bg-card)); }
    .task-card.remind-7 { border-left-color: #38bdf8; background: color-mix(in srgb, #38bdf8 8%, var(--bg-card)); }
    .reminder-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      background: #f59e0b33;
      color: #f59e0b;
    }
    .reminder-badge.r1 { background: #f9731633; color: #f97316; }
    .reminder-badge.r3 { background: #f59e0b33; color: #f59e0b; }
    .reminder-badge.r7 { background: #38bdf833; color: #38bdf8; }

    /* Подзадачи */
    .subtasks {
      margin: 10px 0 12px;
      padding: 10px;
      background: var(--bg);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .subtasks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .subtask-progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .subtask-progress-fill {
      height: 100%;
      background: var(--success);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .subtask-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 0.9rem;
    }
    .subtask-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--success);
      flex-shrink: 0;
    }
    .subtask-item .subtask-text {
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }
    .subtask-item.done .subtask-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .subtask-item button {
      padding: 2px 6px;
      font-size: 0.75rem;
    }
    .subtask-add {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .subtask-add input {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    .settings-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .settings-inline select {
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    /* ========== Адаптив ========== */
    @media (max-width: 600px) {
      h1 { font-size: 1.3rem; }
      .filters { flex-direction: column; }
      .task-header { flex-direction: column; }
      header { flex-direction: column; align-items: stretch; }
      .header-left { justify-content: space-between; }
      .header-right { justify-content: flex-end; }
    }
  </style>
</head>
<body class="dark">
  <div class="container">
    <!-- Шапка -->
    <header>
      <div class="header-left">
        <!-- Блок профиля пользователя -->
        <div class="user-profile-badge" id="openProfileModal" title="Настройки профиля">
          <div class="user-avatar" id="headerUserAvatar">А</div>
          <span class="user-name-display" id="headerUserName">Аман</span>
        </div>
        <h1>📚 Трекер учёбы</h1>
      </div>
      <div class="header-right">
        <button class="theme-toggle" id="themeToggle" title="Переключить тему">
          <span id="themeIcon">☀️</span>
          <span id="themeText">Светлая</span>
        </button>
      </div>
    </header>

    <!-- Прогресс -->
    <section class="progress-section">
      <div class="progress-header">
        <span>Общий прогресс</span>
        <span id="progressText">0 / 0 (0%)</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </section>


    <!-- План на сегодня -->
    <section class="today-plan" id="todayPlanSection">
      <div class="today-plan-header">
        <h2>📌 План на сегодня</h2>
        <div class="settings-inline">
          <label for="reminderDays">Напоминать за</label>
          <select id="reminderDays">
            <option value="1">1 день</option>
            <option value="3" selected>3 дня</option>
            <option value="7">7 дней</option>
          </select>
        </div>
      </div>
      <div class="today-plan-list" id="todayPlanList"></div>
    </section>

    <!-- Управление -->
    <div class="controls">
      <button id="btnAddSubject">+ Предмет</button>
      <button id="btnAddTask">+ Задание</button>
      <button class="secondary" id="btnManageSubjects">Управление предметами</button>
      <button class="secondary" id="btnExport">📤 Экспорт</button>
      <button class="secondary" id="btnImport">📥 Импорт</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    </div>

    <!-- Статистика по предметам -->
    <div class="subject-stats" id="subjectStats"></div>

    <!-- Фильтры -->
    <div class="filters">
      <div>
        <label>Предмет</label>
        <select id="filterSubject">
          <option value="all">Все предметы</option>
        </select>
      </div>
      <div>
        <label>Статус</label>
        <select id="filterStatus">
          <option value="active">Активные</option>
          <option value="completed">Сданные</option>
          <option value="all">Все</option>
        </select>
      </div>
      <div>
        <label>Приоритет</label>
        <select id="filterPriority">
          <option value="all">Любой</option>
          <option value="high">Высокий</option>
          <option value="medium">Средний</option>
          <option value="low">Низкий</option>
        </select>
      </div>
      <div>
        <label>Сортировка</label>
        <select id="sortBy">
          <option value="date">По дате</option>
          <option value="priority">По приоритету</option>
          <option value="subject">По предмету</option>
        </select>
      </div>
    </div>

    <!-- Поиск -->
    <div class="search-sort-row">
      <input type="search" id="searchInput" placeholder="🔍 Поиск по названию задания...">
    </div>

    <!-- Активные / ближайшие дедлайны -->
    <h2 class="section-title" id="activeTitle">📅 Ближайшие дедлайны</h2>
    <div class="tasks-grid" id="activeTasks"></div>

    <!-- Сданные -->
    <h2 class="section-title" id="completedTitle" style="display:none;">✅ Сданные задания</h2>
    <div class="tasks-grid" id="completedTasks"></div>
  </div>

  <!-- ========== Модальное окно: Профиль ========== -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Настройки профиля</h2>
        <button class="modal-close" data-close="profileModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Ваше имя</label>
          <input type="text" id="profileNameInput" placeholder="Введите имя">
        </div>
        <div class="form-group">
          <label>Аватар (фото профиля)</label>
          <div class="avatar-upload-container">
            <div class="avatar-preview-lg" id="modalAvatarPreview">А</div>
            <div>
              <input type="file" id="avatarFileInput" accept="image/*" style="display:none">
              <button type="button" class="secondary small" id="btnSelectAvatar">Загрузить фото</button>
              <button type="button" class="secondary small danger" id="btnRemoveAvatar" style="margin-top:6px;display:none;">Удалить фото</button>
            </div>
          </div>
          <small style="color:var(--text-muted);display:block;margin-top:6px;">Рекомендуется квадратное изображение.</small>
        </div>
      </div>
      <div class="modal-footer">
        <button class="secondary" data-close="profileModal">Отмена</button>
        <button id="saveProfileBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- ========== Модальное окно: Предмет ========== -->
  <div class="modal-overlay" id="subjectModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="subjectModalTitle">Новый предмет</h2>
        <button class="modal-close" data-close="subjectModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Название предмета *</label>
          <input type="text" id="subjectName" placeholder="Например: Математический анализ" required>
        </div>
        <div class="form-group">
          <label>Преподаватель</label>
          <input type="text" id="subjectTeacher" placeholder="ФИО преподавателя">
        </div>
        <div class="form-group">
          <label>Цвет</label>
          <div class="color-picker" id="colorPicker"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="secondary" data-close="subjectModal">Отмена</button>
        <button id="saveSubjectBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- ========== Модальное окно: Задание ========== -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="taskModalTitle">Новое задание</h2>
        <button class="modal-close" data-close="taskModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Предмет *</label>
          <select id="taskSubject" required></select>
        </div>
        <div class="form-group">
          <label>Название задания *</label>
          <input type="text" id="taskTitle" placeholder="Например: Курсовая работа" required>
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea id="taskDescription" placeholder="Краткое описание задания..."></textarea>
        </div>
        <div class="form-group">
          <label>Дата сдачи *</label>
          <input type="date" id="taskDueDate" required>
        </div>
        <div class="form-group">
          <label>Приоритет</label>
          <select id="taskPriority">
            <option value="low">Низкий</option>
            <option value="medium" selected>Средний</option>
            <option value="high">Высокий</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="secondary" data-close="taskModal">Отмена</button>
        <button id="saveTaskBtn">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- ========== Модальное окно: Управление предметами ========== -->
  <div class="modal-overlay" id="manageSubjectsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Управление предметами</h2>
        <button class="modal-close" data-close="manageSubjectsModal">&times;</button>
      </div>
      <div class="modal-body">
        <div id="subjectsManageList"></div>
        <p id="noSubjectsMsg" class="empty-state" style="display:none;">Пока нет ни одного предмета</p>
      </div>
      <div class="modal-footer">
        <button class="secondary" data-close="manageSubjectsModal">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== ДАННЫЕ И ХРАНЕНИЕ ====================
    const STORAGE_KEY = 'studyTrackerData';
    const COLORS = [
      '#3b82f6', '#ef4444', '#22c55e', '#f59e0b', '#8b5cf6',
      '#ec4899', '#06b6d4', '#f97316', '#14b8a6', '#6366f1'
    ];

    let data = {
      subjects: [],
      tasks: [],
      theme: 'dark',
      profile: {
        name: 'Аман',
        avatar: ''
      },
      settings: {
        reminderDays: 3
      }
    };

    let editingSubjectId = null;
    let editingTaskId = null;
    let selectedColor = COLORS[0];
    let tempAvatarBase64 = ''; // временная переменная для аватара в модалке

    function safeStorageGet(key) {
      try {
        return window.localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    }

    function safeStorageSet(key, value) {
      try {
        window.localStorage.setItem(key, value);
        return true;
      } catch (e) {
        return false;
      }
    }

    // Загрузка данных
    function loadData() {
      try {
        const saved = safeStorageGet(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          data.subjects = Array.isArray(parsed.subjects) ? parsed.subjects : [];
          data.tasks = Array.isArray(parsed.tasks) ? parsed.tasks : [];
          data.tasks.forEach(t => {
            if (!Array.isArray(t.subtasks)) t.subtasks = [];
          });
          data.theme = parsed.theme === 'light' ? 'light' : 'dark';
          if (parsed.profile) {
            data.profile.name = parsed.profile.name || 'Аман';
            data.profile.avatar = parsed.profile.avatar || '';
          }
          const rd = parsed.settings && Number(parsed.settings.reminderDays);
          data.settings = {
            reminderDays: (rd === 1 || rd === 3 || rd === 7) ? rd : 3
          };
        }
      } catch (e) {
        // Игнорируем ошибки
      }
      applyTheme(data.theme);
      updateProfileUI();
      const remSel = document.getElementById('reminderDays');
      if (remSel) remSel.value = String(data.settings.reminderDays || 3);
    }

    // Сохранение данных
    function saveData() {
      try {
        safeStorageSet(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        // Игнорируем
      }
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    // ==================== ПРОФИЛЬ ====================
    function updateProfileUI() {
      const name = data.profile.name || 'Аман';
      const avatar = data.profile.avatar;

      document.getElementById('headerUserName').textContent = name;
      
      const headerAvatarEl = document.getElementById('headerUserAvatar');
      if (avatar) {
        headerAvatarEl.innerHTML = `<img src="${avatar}" alt="Avatar">`;
      } else {
        headerAvatarEl.textContent = name.charAt(0).toUpperCase();
      }
    }

    document.getElementById('openProfileModal').addEventListener('click', () => {
      document.getElementById('profileNameInput').value = data.profile.name || '';
      tempAvatarBase64 = data.profile.avatar || '';
      renderModalAvatarPreview();
      openModal('profileModal');
    });

    function renderModalAvatarPreview() {
      const previewEl = document.getElementById('modalAvatarPreview');
      const removeBtn = document.getElementById('btnRemoveAvatar');
      const name = document.getElementById('profileNameInput').value || 'А';

      if (tempAvatarBase64) {
        previewEl.innerHTML = `<img src="${tempAvatarBase64}" alt="Avatar">`;
        removeBtn.style.display = 'inline-block';
      } else {
        previewEl.innerHTML = name.charAt(0).toUpperCase();
        removeBtn.style.display = 'none';
      }
    }

    document.getElementById('profileNameInput').addEventListener('input', (e) => {
      if (!tempAvatarBase64) {
        const previewEl = document.getElementById('modalAvatarPreview');
        previewEl.textContent = (e.target.value.trim().charAt(0) || 'А').toUpperCase();
      }
    });

    document.getElementById('btnSelectAvatar').addEventListener('click', () => {
      document.getElementById('avatarFileInput').click();
    });

    document.getElementById('avatarFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        // Сжатие изображения перед сохранением в Base64 для экономии места в localStorage
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_SIZE = 150; // максимальная ширина/высота аватара
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          tempAvatarBase64 = canvas.toDataURL('image/jpeg', 0.85);
          renderModalAvatarPreview();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    document.getElementById('btnRemoveAvatar').addEventListener('click', () => {
      tempAvatarBase64 = '';
      renderModalAvatarPreview();
    });

    document.getElementById('saveProfileBtn').addEventListener('click', () => {
      const newName = document.getElementById('profileNameInput').value.trim();
      data.profile.name = newName || 'Аман';
      data.profile.avatar = tempAvatarBase64;

      saveData();
      updateProfileUI();
      closeModal('profileModal');
    });

    // ==================== ТЕМА ====================
    function applyTheme(theme) {
      document.body.className = theme;
      data.theme = theme;
      const isLight = theme === 'light';
      document.getElementById('themeIcon').textContent = isLight ? '🌙' : '☀️';
      document.getElementById('themeText').textContent = isLight ? 'Тёмная' : 'Светлая';
      saveData();
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      applyTheme(data.theme === 'dark' ? 'light' : 'dark');
    });

    // ==================== МОДАЛЬНЫЕ ОКНА ====================
    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', () => closeModal(btn.dataset.close));
    });

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal(overlay.id);
      });
    });

    // ==================== ПРЕДМЕТЫ ====================
    function renderColorPicker() {
      const picker = document.getElementById('colorPicker');
      picker.innerHTML = '';
      COLORS.forEach(color => {
        const div = document.createElement('div');
        div.className = 'color-option' + (color === selectedColor ? ' selected' : '');
        div.style.background = color;
        div.addEventListener('click', () => {
          selectedColor = color;
          renderColorPicker();
        });
        picker.appendChild(div);
      });
    }

    function openSubjectModal(subject = null) {
      editingSubjectId = subject ? subject.id : null;
      document.getElementById('subjectModalTitle').textContent = subject ? 'Редактировать предмет' : 'Новый предмет';
      document.getElementById('subjectName').value = subject ? subject.name : '';
      document.getElementById('subjectTeacher').value = subject ? subject.teacher : '';
      selectedColor = subject ? subject.color : COLORS[0];
      renderColorPicker();
      openModal('subjectModal');
    }

    document.getElementById('btnAddSubject').addEventListener('click', () => openSubjectModal());

    document.getElementById('saveSubjectBtn').addEventListener('click', () => {
      const name = document.getElementById('subjectName').value.trim();
      const teacher = document.getElementById('subjectTeacher').value.trim();

      if (!name) {
        alert('Введите название предмета');
        return;
      }

      if (editingSubjectId) {
        const subj = data.subjects.find(s => s.id === editingSubjectId);
        if (subj) {
          subj.name = name;
          subj.teacher = teacher;
          subj.color = selectedColor;
        }
      } else {
        data.subjects.push({
          id: generateId(),
          name,
          teacher,
          color: selectedColor
        });
      }

      saveData();
      closeModal('subjectModal');
      updateUI();
    });

    document.getElementById('btnManageSubjects').addEventListener('click', () => {
      renderManageSubjects();
      openModal('manageSubjectsModal');
    });

    function renderManageSubjects() {
      const list = document.getElementById('subjectsManageList');
      const noMsg = document.getElementById('noSubjectsMsg');
      list.innerHTML = '';

      if (data.subjects.length === 0) {
        noMsg.style.display = 'block';
        return;
      }
      noMsg.style.display = 'none';

      data.subjects.forEach(subj => {
        const div = document.createElement('div');
        div.className = 'subject-chip';
        div.style.marginBottom = '10px';
        div.style.width = '100%';
        div.style.justifyContent = 'space-between';
        div.innerHTML = `
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="subject-color" style="background:${subj.color}"></span>
            <div>
              <strong>${escapeHtml(subj.name)}</strong>
              ${subj.teacher ? `<br><small style="color:var(--text-muted)">${escapeHtml(subj.teacher)}</small>` : ''}
            </div>
          </div>
          <div style="display:flex;gap:6px;">
            <button class="small secondary" data-edit="${subj.id}">✏️</button>
            <button class="small danger" data-delete="${subj.id}">🗑️</button>
          </div>
        `;
        list.appendChild(div);
      });

      list.querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => {
          const subj = data.subjects.find(s => s.id === btn.dataset.edit);
          closeModal('manageSubjectsModal');
          openSubjectModal(subj);
        });
      });

      list.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!confirm('Удалить предмет и все связанные задания?')) return;
          const id = btn.dataset.delete;
          data.subjects = data.subjects.filter(s => s.id !== id);
          data.tasks = data.tasks.filter(t => t.subjectId !== id);
          saveData();
          renderManageSubjects();
          updateUI();
        });
      });
    }

    // ==================== ЗАДАНИЯ ====================
    function openTaskModal(task = null) {
      editingTaskId = task ? task.id : null;
      document.getElementById('taskModalTitle').textContent = task ? 'Редактировать задание' : 'Новое задание';

      const select = document.getElementById('taskSubject');
      select.innerHTML = '';
      if (data.subjects.length === 0) {
        select.innerHTML = '<option value="">Сначала добавьте предмет</option>';
      } else {
        data.subjects.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = s.name;
          select.appendChild(opt);
        });
      }

      document.getElementById('taskTitle').value = task ? task.title : '';
      document.getElementById('taskDescription').value = task ? task.description : '';
      document.getElementById('taskDueDate').value = task ? task.dueDate : '';
      document.getElementById('taskPriority').value = task ? task.priority : 'medium';

      if (task) {
        select.value = task.subjectId;
      }

      openModal('taskModal');
    }

    document.getElementById('btnAddTask').addEventListener('click', () => {
      if (data.subjects.length === 0) {
        alert('Сначала добавьте хотя бы один предмет');
        openSubjectModal();
        return;
      }
      openTaskModal();
    });

    document.getElementById('saveTaskBtn').addEventListener('click', () => {
      const subjectId = document.getElementById('taskSubject').value;
      const title = document.getElementById('taskTitle').value.trim();
      const description = document.getElementById('taskDescription').value.trim();
      const dueDate = document.getElementById('taskDueDate').value;
      const priority = document.getElementById('taskPriority').value;

      if (!subjectId || !title || !dueDate) {
        alert('Заполните обязательные поля: предмет, название и дату сдачи');
        return;
      }

      if (editingTaskId) {
        const task = data.tasks.find(t => t.id === editingTaskId);
        if (task) {
          task.subjectId = subjectId;
          task.title = title;
          task.description = description;
          task.dueDate = dueDate;
          task.priority = priority;
        }
      } else {
        data.tasks.push({
          id: generateId(),
          subjectId,
          title,
          description,
          dueDate,
          priority,
          completed: false,
          completedAt: null,
          subtasks: []
        });
      }

      saveData();
      closeModal('taskModal');
      updateUI();
    });

    function toggleTaskCompleted(taskId) {
      const task = data.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.completed = !task.completed;
      if (task.completed) {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        task.completedAt = `${y}-${m}-${d}`;
      } else {
        task.completedAt = null;
      }
      saveData();
      updateUI();
    }

    function deleteTask(taskId) {
      if (!confirm('Удалить это задание?')) return;
      data.tasks = data.tasks.filter(t => t.id !== taskId);
      saveData();
      updateUI();
    }


    // ==================== ПОДЗАДАЧИ ====================
    function ensureSubtasks(task) {
      if (!task.subtasks || !Array.isArray(task.subtasks)) task.subtasks = [];
      return task.subtasks;
    }

    function getSubtaskProgress(task) {
      const list = ensureSubtasks(task);
      if (!list.length) return { done: 0, total: 0, percent: 0 };
      const done = list.filter(s => s.done).length;
      return { done, total: list.length, percent: Math.round((done / list.length) * 100) };
    }

    function addSubtask(taskId, text) {
      const task = data.tasks.find(t => t.id === taskId);
      if (!task) return;
      const t = text.trim();
      if (!t) return;
      ensureSubtasks(task).push({ id: generateId(), text: t, done: false });
      saveData();
      updateUI();
    }

    function toggleSubtask(taskId, subId) {
      const task = data.tasks.find(t => t.id === taskId);
      if (!task) return;
      const s = ensureSubtasks(task).find(x => x.id === subId);
      if (!s) return;
      s.done = !s.done;
      saveData();
      updateUI();
    }

    function editSubtask(taskId, subId) {
      const task = data.tasks.find(t => t.id === taskId);
      if (!task) return;
      const s = ensureSubtasks(task).find(x => x.id === subId);
      if (!s) return;
      const next = prompt('Изменить пункт:', s.text);
      if (next === null) return;
      const t = next.trim();
      if (!t) return;
      s.text = t;
      saveData();
      updateUI();
    }

    function deleteSubtask(taskId, subId) {
      const task = data.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.subtasks = ensureSubtasks(task).filter(x => x.id !== subId);
      saveData();
      updateUI();
    }

    function renderSubtasksBlock(task) {
      if (task.completed) return '';
      const list = ensureSubtasks(task);
      const prog = getSubtaskProgress(task);
      const items = list.map(s => `
        <div class="subtask-item ${s.done ? 'done' : ''}">
          <input type="checkbox" ${s.done ? 'checked' : ''} data-toggle-sub="${task.id}" data-sub-id="${s.id}">
          <span class="subtask-text">${escapeHtml(s.text)}</span>
          <button class="small secondary" data-edit-sub="${task.id}" data-sub-id="${s.id}" title="Изменить">✏️</button>
          <button class="small danger" data-del-sub="${task.id}" data-sub-id="${s.id}" title="Удалить">🗑️</button>
        </div>
      `).join('');
      return `
        <div class="subtasks">
          <div class="subtasks-header">
            <span>Чек-лист</span>
            <span>${prog.total ? prog.done + ' / ' + prog.total + ' (' + prog.percent + '%)' : 'пусто'}</span>
          </div>
          ${prog.total ? `<div class="subtask-progress-bar"><div class="subtask-progress-fill" style="width:${prog.percent}%"></div></div>` : ''}
          ${items}
          <div class="subtask-add">
            <input type="text" placeholder="Новый пункт..." data-sub-input="${task.id}">
            <button class="small" data-add-sub="${task.id}">+</button>
          </div>
        </div>
      `;
    }

    function bindSubtaskHandlers(root) {
      const scope = root || document;
      scope.querySelectorAll('[data-toggle-sub]').forEach(el => {
        el.addEventListener('change', () => toggleSubtask(el.dataset.toggleSub, el.dataset.subId));
      });
      scope.querySelectorAll('[data-edit-sub]').forEach(el => {
        el.addEventListener('click', () => editSubtask(el.dataset.editSub, el.dataset.subId));
      });
      scope.querySelectorAll('[data-del-sub]').forEach(el => {
        el.addEventListener('click', () => deleteSubtask(el.dataset.delSub, el.dataset.subId));
      });
      scope.querySelectorAll('[data-add-sub]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.addSub;
          const input = scope.querySelector(`[data-sub-input="${id}"]`);
          if (input) {
            addSubtask(id, input.value);
            input.value = '';
          }
        });
      });
      scope.querySelectorAll('[data-sub-input]').forEach(input => {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            addSubtask(input.dataset.subInput, input.value);
            input.value = '';
          }
        });
      });
    }

    // ==================== ПЛАН НА СЕГОДНЯ ====================
    function renderTodayPlan() {
      const list = document.getElementById('todayPlanList');
      if (!list) return;
      const items = data.tasks.filter(t => {
        if (t.completed) return false;
        const d = getDaysLeft(t.dueDate);
        return d <= 0;
      }).sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));

      if (!items.length) {
        list.innerHTML = '<div class="empty-state" style="padding:16px;">На сегодня срочных заданий нет</div>';
        return;
      }

      list.innerHTML = items.map(task => {
        const subj = getSubject(task.subjectId);
        const days = getDaysLeft(task.dueDate);
        const cls = days < 0 ? 'overdue' : 'today';
        const status = days < 0 ? `Просрочено на ${Math.abs(days)} дн.` : 'Сдать сегодня';
        return `
          <div class="today-item ${cls}">
            <div class="today-item-info">
              <div class="today-item-title">${escapeHtml(task.title)}</div>
              <div class="today-item-meta">
                <span class="subject-badge" style="background:${subj.color}">${escapeHtml(subj.name)}</span>
                · ${formatDate(task.dueDate)} · ${status}
              </div>
            </div>
            <button class="small" data-complete="${task.id}">✅ Сдано</button>
          </div>
        `;
      }).join('');

      list.querySelectorAll('[data-complete]').forEach(btn => {
        btn.addEventListener('click', () => toggleTaskCompleted(btn.dataset.complete));
      });
    }

    // ==================== РЕНДЕР ИНТЕРФЕЙСА ====================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getSubject(id) {
      return data.subjects.find(s => s.id === id) || { name: 'Неизвестный', color: '#64748b', teacher: '' };
    }

    function getDaysLeft(dueDate) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = new Date(dueDate);
      due.setHours(0, 0, 0, 0);
      return Math.round((due - today) / (1000 * 60 * 60 * 24));
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const part = String(dateStr).slice(0, 10);
      const [y, m, d] = part.split('-').map(Number);
      if (!y || !m || !d) return dateStr;
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function priorityLabel(p) {
      return { low: 'Низкий', medium: 'Средний', high: 'Высокий' }[p] || p;
    }

    function updateProgress() {
      const total = data.tasks.length;
      const done = data.tasks.filter(t => t.completed).length;
      const percent = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById('progressText').textContent = `${done} / ${total} (${percent}%)`;
      document.getElementById('progressFill').style.width = percent + '%';
    }

    function updateSubjectStats() {
      const container = document.getElementById('subjectStats');
      if (!data.subjects.length) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = data.subjects.map(subj => {
        const tasks = data.tasks.filter(t => t.subjectId === subj.id);
        const total = tasks.length;
        const done = tasks.filter(t => t.completed).length;
        const percent = total === 0 ? 0 : Math.round((done / total) * 100);
        return `
          <div class="subject-stat-card">
            <div class="subject-stat-header">
              <span class="subject-color" style="background:${subj.color};width:12px;height:12px;border-radius:50%;display:inline-block;"></span>
              ${escapeHtml(subj.name)}
            </div>
            <div class="subject-stat-bar">
              <div class="subject-stat-fill" style="width:${percent}%;background:${subj.color}"></div>
            </div>
            <div class="subject-stat-text">${done} / ${total} (${percent}%)</div>
          </div>
        `;
      }).join('');
    }

    function updateFilters() {
      const select = document.getElementById('filterSubject');
      const current = select.value;
      select.innerHTML = '<option value="all">Все предметы</option>';
      data.subjects.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        select.appendChild(opt);
      });
      select.value = current || 'all';
    }

    function getPriorityWeight(p) {
      return { high: 0, medium: 1, low: 2 }[p] ?? 3;
    }

    function sortTasks(list, sortBy) {
      const arr = [...list];
      if (sortBy === 'priority') {
        arr.sort((a, b) => getPriorityWeight(a.priority) - getPriorityWeight(b.priority) ||
          new Date(a.dueDate) - new Date(b.dueDate));
      } else if (sortBy === 'subject') {
        arr.sort((a, b) => {
          const na = getSubject(a.subjectId).name.toLowerCase();
          const nb = getSubject(b.subjectId).name.toLowerCase();
          return na.localeCompare(nb, 'ru') || new Date(a.dueDate) - new Date(b.dueDate);
        });
      } else {
        arr.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
      }
      return arr;
    }

    function renderTasks() {
      const filterSubject = document.getElementById('filterSubject').value;
      const filterStatus = document.getElementById('filterStatus').value;
      const filterPriority = document.getElementById('filterPriority').value;
      const sortBy = document.getElementById('sortBy').value;
      const search = (document.getElementById('searchInput').value || '').trim().toLowerCase();

      let tasks = [...data.tasks];

      if (filterSubject !== 'all') {
        tasks = tasks.filter(t => t.subjectId === filterSubject);
      }
      if (filterPriority !== 'all') {
        tasks = tasks.filter(t => t.priority === filterPriority);
      }
      if (search) {
        tasks = tasks.filter(t => t.title.toLowerCase().includes(search));
      }

      let active = tasks.filter(t => !t.completed);
      let completed = tasks.filter(t => t.completed);

      active = sortTasks(active, sortBy);
      if (sortBy === 'date') {
        completed.sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));
      } else {
        completed = sortTasks(completed, sortBy);
      }

      const activeContainer = document.getElementById('activeTasks');
      const completedContainer = document.getElementById('completedTasks');
      const activeTitle = document.getElementById('activeTitle');
      const completedTitle = document.getElementById('completedTitle');

      if (filterStatus === 'completed') {
        activeContainer.innerHTML = '';
        activeTitle.style.display = 'none';
      } else {
        activeTitle.style.display = 'flex';
        activeTitle.textContent = filterStatus === 'all' ? '📅 Все активные задания' : '📅 Ближайшие дедлайны';
        if (active.length === 0) {
          activeContainer.innerHTML = '<div class="empty-state">Нет активных заданий</div>';
        } else {
          activeContainer.innerHTML = active.map(task => createTaskCard(task)).join('');
        }
      }

      if (filterStatus === 'active') {
        completedContainer.innerHTML = '';
        completedTitle.style.display = 'none';
      } else {
        completedTitle.style.display = completed.length ? 'flex' : 'none';
        if (completed.length === 0) {
          completedContainer.innerHTML = '';
        } else {
          completedContainer.innerHTML = completed.map(task => createTaskCard(task)).join('');
        }
      }

      document.querySelectorAll('[data-complete]').forEach(btn => {
        btn.addEventListener('click', () => toggleTaskCompleted(btn.dataset.complete));
      });
      document.querySelectorAll('[data-edit-task]').forEach(btn => {
        btn.addEventListener('click', () => {
          const task = data.tasks.find(t => t.id === btn.dataset.editTask);
          openTaskModal(task);
        });
      });
      document.querySelectorAll('[data-delete-task]').forEach(btn => {
        btn.addEventListener('click', () => deleteTask(btn.dataset.deleteTask));
      });
      bindSubtaskHandlers(document);
    }

    function createTaskCard(task) {
      const subj = getSubject(task.subjectId);
      const days = getDaysLeft(task.dueDate);
      const reminderDays = (data.settings && data.settings.reminderDays) || 3;
      let statusClass = '';
      let daysText = '';
      let remindBadge = '';

      if (task.completed) {
        statusClass = 'completed';
        daysText = `Сдано ${task.completedAt ? formatDate(task.completedAt) : ''}`;
      } else if (days < 0) {
        statusClass = 'overdue';
        daysText = `Просрочено на ${Math.abs(days)} дн.`;
      } else if (days === 0) {
        statusClass = 'remind-1';
        daysText = 'Сдать сегодня!';
        remindBadge = '<span class="reminder-badge r1">Сегодня</span>';
      } else if (days <= reminderDays) {
        if (days <= 1) statusClass = 'remind-1';
        else if (days <= 3) statusClass = 'remind-3';
        else statusClass = 'remind-7';
        daysText = `Осталось ${days} дн.`;
        const rcls = days <= 1 ? 'r1' : (days <= 3 ? 'r3' : 'r7');
        remindBadge = `<span class="reminder-badge ${rcls}">Через ${days} дн.</span>`;
      } else {
        daysText = `Осталось ${days} дн.`;
      }

      const prog = getSubtaskProgress(task);
      const subProg = (!task.completed && prog.total)
        ? `<span class="badge" style="background:#22c55e33;color:#22c55e;">Чек-лист ${prog.done}/${prog.total}</span>`
        : '';

      return `
        <div class="task-card ${statusClass}">
          <div class="task-header">
            <div class="task-title">${escapeHtml(task.title)}</div>
            <span class="badge priority-${task.priority}">${priorityLabel(task.priority)}</span>
          </div>
          <div class="task-meta">
            <span class="subject-badge" style="background:${subj.color}">${escapeHtml(subj.name)}</span>
            <span>📅 ${formatDate(task.dueDate)}</span>
            <span>${daysText}</span>
            ${remindBadge}
            ${subProg}
          </div>
          ${task.description ? `<div class="task-desc">${escapeHtml(task.description)}</div>` : ''}
          ${renderSubtasksBlock(task)}
          <div class="task-actions">
            <button class="small ${task.completed ? 'secondary' : ''}" data-complete="${task.id}">
              ${task.completed ? '↩️ Вернуть' : '✅ Сдано'}
            </button>
            <button class="small secondary" data-edit-task="${task.id}">✏️</button>
            <button class="small danger" data-delete-task="${task.id}">🗑️</button>
          </div>
        </div>
      `;
    }

    function updateUI() {
      updateProgress();
      updateSubjectStats();
      updateFilters();
      renderTodayPlan();
      renderTasks();
    }

    ['filterSubject', 'filterStatus', 'filterPriority', 'sortBy'].forEach(id => {
      document.getElementById(id).addEventListener('change', renderTasks);
    });
    document.getElementById('searchInput').addEventListener('input', renderTasks);

    // ==================== ЭКСПОРТ / ИМПОРТ ====================
    document.getElementById('btnExport').addEventListener('click', () => {
      const exportData = {
        subjects: data.subjects,
        tasks: data.tasks,
        theme: data.theme,
        profile: data.profile,
        settings: data.settings,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `study-tracker-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('btnImport').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!imported.subjects || !imported.tasks) {
            alert('Неверный формат файла');
            return;
          }
          if (!confirm('Импорт заменит текущие данные. Продолжить?')) return;
          data.subjects = Array.isArray(imported.subjects) ? imported.subjects : [];
          data.tasks = Array.isArray(imported.tasks) ? imported.tasks : [];
          if (imported.theme === 'light' || imported.theme === 'dark') {
            data.theme = imported.theme;
          }
          if (imported.profile) {
            data.profile.name = imported.profile.name || 'Аман';
            data.profile.avatar = imported.profile.avatar || '';
          }
          data.tasks.forEach(t => { if (!Array.isArray(t.subtasks)) t.subtasks = []; });
          const rd = imported.settings && Number(imported.settings.reminderDays);
          data.settings = { reminderDays: (rd === 1 || rd === 3 || rd === 7) ? rd : (data.settings?.reminderDays || 3) };
          const remSel = document.getElementById('reminderDays');
          if (remSel) remSel.value = String(data.settings.reminderDays);
          saveData();
          applyTheme(data.theme);
          updateProfileUI();
          updateUI();
          alert('Данные успешно импортированы');
        } catch (err) {
          alert('Ошибка чтения файла: ' + err.message);
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    });

    document.getElementById('reminderDays').addEventListener('change', (e) => {
      const v = Number(e.target.value);
      data.settings.reminderDays = (v === 1 || v === 3 || v === 7) ? v : 3;
      saveData();
      updateUI();
    });

    // ==================== ИНИЦИАЛИЗАЦИЯ ====================
    loadData();
    updateUI();
  </script>
</body>
</html>
